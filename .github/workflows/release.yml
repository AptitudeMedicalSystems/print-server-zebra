name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stage release compose asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p _release
          # Rewrite the pinned image tag in the station-v2 variant to match this release,
          # then publish it under the standard name docker-compose.yml.
          sed -E "s|(print-server-zebra):[0-9]+\.[0-9]+\.[0-9]+|\1:${{ steps.meta.outputs.version }}|" \
            docker-compose.station-v2.yml > _release/docker-compose.yml
          echo "--- asset preview ---"
          head -5 _release/docker-compose.yml

      - name: Create GitHub Release and attach compose
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: _release/docker-compose.yml
          generate_release_notes: true
